name: E2E (real server)

# Installs SteamCMD and a real Valheim dedicated server, starts it, stops it and checks the world was saved.
# Heavy (~1 GB download), so it runs on demand and weekly rather than on every push.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  valheim-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NELEDPORT_E2E: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Libraries SteamCMD and Valheim need
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y lib32gcc-s1 libatomic1 libpulse0
      - run: npm ci
      - run: npx vitest run src/e2e/valheim.e2e.test.ts
