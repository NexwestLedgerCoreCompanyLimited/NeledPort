name: E2E (real server)

# Installs SteamCMD and real dedicated servers, starts them, stops them and checks the world was saved:
# Valheim on Linux and Windows; Palworld, Rust, Source, GoldSrc and Unreal Engine RCON games on Linux.
# Heavy (Rust alone is ~10 GB), so it runs on demand and weekly rather than on every push.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  NELEDPORT_E2E: '1'

jobs:
  linux:
    name: ${{ matrix.game }} on Linux
    strategy:
      fail-fast: false
      matrix:
        game: [valheim, palworld, rust, counter-strike-source, team-fortress-2, counter-strike-1-6, day-of-defeat, sven-co-op, ark-survival-evolved, squad, squad-44, insurgency-sandstorm, mordhau, operation-harsh-doorstop, conan-exiles, humanitz]
        include:
          # Source and GoldSrc games share one test file per engine; NELEDPORT_E2E_GAME picks the game.
          - { game: valheim, test: valheim }
          - { game: palworld, test: palworld }
          - { game: rust, test: rust }
          - { game: counter-strike-source, test: source }
          - { game: team-fortress-2, test: source }
          - { game: counter-strike-1-6, test: goldsrc }
          - { game: day-of-defeat, test: goldsrc }
          - { game: sven-co-op, test: goldsrc }
          # Unreal Engine games driven over RCON by their definitions' own commands.
          - { game: ark-survival-evolved, test: rcon }
          - { game: squad, test: rcon }
          - { game: squad-44, test: rcon }
          - { game: insurgency-sandstorm, test: rcon }
          - { game: mordhau, test: rcon }
          - { game: operation-harsh-doorstop, test: rcon }
          - { game: conan-exiles, test: rcon }
          - { game: humanitz, test: rcon }
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Free disk space for the big servers
        if: matrix.game == 'rust' || matrix.game == 'team-fortress-2' || matrix.test == 'rcon'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Libraries SteamCMD and the servers need
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y lib32gcc-s1 lib32stdc++6 libsdl2-2.0-0:i386 libcurl4-gnutls-dev:i386 libatomic1 libpulse0
      - run: npm ci
      - run: npx vitest run src/e2e/${{ matrix.test }}.e2e.test.ts
        env:
          NELEDPORT_E2E_GAME: ${{ matrix.game }}

  windows:
    name: valheim on Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run src/e2e/valheim.e2e.test.ts
