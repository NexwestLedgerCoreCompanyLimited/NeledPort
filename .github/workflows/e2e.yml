name: E2E (real server)

# Installs SteamCMD and real dedicated servers, starts them, stops them and checks the world was saved:
# Valheim on Linux and Windows; Palworld, Rust, Source, GoldSrc, Unreal Engine RCON and console games on Linux.
# Heavy (Rust alone is ~10 GB), so it runs on demand and weekly rather than on every push.
on:
  workflow_dispatch:
    inputs:
      only:
        description: Comma-separated game ids to test (empty = all)
        required: false
        default: ''
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  NELEDPORT_E2E: '1'

jobs:
  # Games and their test files live in e2e-games.json; "only" runs a comma-separated subset of them.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: pick
        env:
          ONLY: ${{ inputs.only }}
        run: echo "matrix=$(jq -c --arg only "$ONLY" '[.[] | select(.game as $g | $only == "" or ($only | split(",") | index($g) != null))]' .github/e2e-games.json)" >> "$GITHUB_OUTPUT"

  linux:
    name: ${{ matrix.game }} on Linux
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Free disk space for the big servers
        if: matrix.game == 'rust' || matrix.game == 'team-fortress-2' || matrix.test == 'rcon'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Libraries SteamCMD and the servers need
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y lib32gcc-s1 lib32stdc++6 libsdl2-2.0-0:i386 libcurl4-gnutls-dev:i386 libatomic1 libpulse0
      - run: npm ci
      - run: npx vitest run src/e2e/${{ matrix.test }}.e2e.test.ts
        env:
          NELEDPORT_E2E_GAME: ${{ matrix.game }}

  windows:
    name: valheim on Windows
    if: inputs.only == '' || contains(format(',{0},', inputs.only), ',valheim,')
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run src/e2e/valheim.e2e.test.ts
