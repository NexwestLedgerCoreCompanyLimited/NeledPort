name: E2E (real server)

# Installs SteamCMD and real dedicated servers, starts them, stops them and checks the world was saved:
# Valheim on Linux and Windows, Palworld on Linux. Heavy (several GB of downloads), so it runs on demand
# and weekly rather than on every push.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  NELEDPORT_E2E: '1'

jobs:
  linux:
    name: ${{ matrix.game }} on Linux
    strategy:
      fail-fast: false
      matrix:
        game: [valheim, palworld]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Libraries SteamCMD and the servers need
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y lib32gcc-s1 libatomic1 libpulse0
      - run: npm ci
      - run: npx vitest run src/e2e/${{ matrix.game }}.e2e.test.ts

  windows:
    name: valheim on Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run src/e2e/valheim.e2e.test.ts
